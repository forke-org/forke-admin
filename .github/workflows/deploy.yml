name: Build, Verify & Deploy

# Same shape in every Forke app: check every pull request, deploy main to the Oracle server.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Error Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_APP_URL: 'https://forke.space'
          NEXT_PUBLIC_DASHBOARD_URL: 'https://dashboard.forke.space'
          NEXT_PUBLIC_ADMIN_URL: 'https://admin.forke.space'

  deploy:
    name: Deploy to Oracle Cloud
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time per app, so two quick merges never clash on the server.
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Build and restart on the server (zero downtime, with health check)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            /opt/forke/scripts/deploy-app.sh forke-admin
